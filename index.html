<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘 점심 뭐 먹지? 🍽️ 점심메뉴 룰렛</title>
<style>
  :root {
    --bg1: #1a1c2e;
    --bg2: #2a1e3f;
    --accent: #ff6b6b;
    --accent2: #ffd93d;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: radial-gradient(circle at 20% 20%, #3a2a5f 0%, var(--bg1) 60%, #0e0f1a 100%);
    color: #fff;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px 48px;
    overflow-x: hidden;
  }
  h1 {
    font-size: clamp(26px, 5vw, 42px);
    text-align: center;
    margin-top: 10px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
  }
  .subtitle {
    margin-top: 8px;
    color: #c9c6e0;
    font-size: 15px;
    text-align: center;
  }

  /* 룰렛 창 */
  .reel-window {
    position: relative;
    width: min(960px, 100%);
    height: 240px;
    margin-top: 28px;
    overflow: hidden;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.4);
  }
  /* 양옆 페이드 */
  .reel-window::before,
  .reel-window::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 120px;
    z-index: 3;
    pointer-events: none;
  }
  .reel-window::before { left: 0; background: linear-gradient(90deg, rgba(14,15,26,0.95), transparent); }
  .reel-window::after { right: 0; background: linear-gradient(270deg, rgba(14,15,26,0.95), transparent); }

  /* 중앙 표시기 */
  .marker {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    z-index: 2;
    border-left: 3px dashed rgba(255,217,61,0.8);
    border-right: 3px dashed rgba(255,217,61,0.8);
    pointer-events: none;
  }
  .marker .pin {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
  }
  .marker .pin.top { top: -2px; }
  .marker .pin.bottom { bottom: -2px; transform: translateX(-50%) rotate(180deg); }

  .strip {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    will-change: transform;
  }
  .item {
    width: 180px;
    height: 200px;
    margin: 0 10px;
    border-radius: 18px;
    background: var(--card);
    color: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    gap: 10px;
    transition: transform 0.2s;
  }
  .item .emoji { font-size: 72px; line-height: 1; }
  .item .name {
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    padding: 0 8px;
    word-break: keep-all;
  }
  .item.win { outline: 4px solid var(--accent2); }

  /* 버튼 */
  .controls { margin-top: 30px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: inherit;
    font-size: 20px;
    font-weight: 800;
    color: #1a1c2e;
    background: linear-gradient(90deg, var(--accent2), #ffb347);
    border: none;
    padding: 16px 40px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(255,179,71,0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(255,179,71,0.55); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: rgba(255,255,255,0.12);
    color: #fff;
    box-shadow: none;
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* 결과 */
  .result {
    margin-top: 28px;
    text-align: center;
    min-height: 120px;
    opacity: 0;
    transform: translateY(10px) scale(0.97);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .result.show { opacity: 1; transform: translateY(0) scale(1); }
  .result .label { font-size: 16px; color: #ffd93d; letter-spacing: 2px; }
  .result .big-emoji { font-size: 90px; margin: 6px 0; }
  .result .big-name {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 900;
    background: linear-gradient(90deg, #fff, #ffd93d);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .count { margin-top: 18px; color: #8a87a8; font-size: 13px; }
  .footer { margin-top: 26px; color: #6f6c8a; font-size: 12px; text-align: center; }

  @media (max-width: 520px) {
    .reel-window { height: 200px; }
    .item { width: 140px; height: 160px; margin: 0 7px; }
    .item .emoji { font-size: 56px; }
    .item .name { font-size: 15px; }
    .marker { width: 154px; }
  }
</style>
</head>
<body>
  <h1>오늘 점심 뭐 먹지? 🍽️</h1>
  <p class="subtitle">시작 버튼을 누르면 룰렛이 돌아가며 메뉴를 추천해드려요!</p>

function emojiFor(name) {
  for (const [pat, emo] of EMOJI_RULES) {
    if (new RegExp(pat).test(name)) return emo;
  }
  return "🍽️";
}

/* ===== DOM & 상태 ===== */
const strip = document.getElementById("strip");
const spinBtn = document.getElementById("spinBtn");
const againBtn = document.getElementById("againBtn");
const result = document.getElementById("result");
const resEmoji = document.getElementById("resEmoji");
const resName = document.getElementById("resName");
const count = document.getElementById("count");

count.textContent = `총 ${MENUS.length}가지 메뉴 중에서 추천합니다`;

const ITEM_W = window.matchMedia("(max-width:520px)").matches ? 154 : 200; // 카드폭+좌우마진
let spinning = false;

function makeItem(name) {
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `<div class="emoji">${emojiFor(name)}</div><div class="name">${name}</div>`;
  return div;
}

function rand(n) { return Math.floor(Math.random() * n); }

// 초기 미리보기 채우기
function fillIdle() {
  strip.style.transition = "none";
  strip.style.transform = "translateX(0)";
  strip.innerHTML = "";
  for (let i = 0; i < 12; i++) {
    strip.appendChild(makeItem(MENUS[rand(MENUS.length)]));
  }
}
fillIdle();

function spin() {
  if (spinning) return;
  spinning = true;
  spinBtn.disabled = true;
  againBtn.style.display = "none";
  result.classList.remove("show");

  // 당첨 메뉴 선택
  const winIndex = rand(MENUS.length);
  const winName = MENUS[winIndex];

  // 긴 스트립 구성: 앞쪽에 당첨 카드, 뒤쪽에 랜덤 필러
  // -> 스트립을 오른쪽으로 이동시키면 카드들이 왼쪽에서 오른쪽으로 흐르며 당첨이 중앙으로 들어옴
  const WIN_AT = 8;            // 당첨 카드의 위치(앞에서 8번째)
  const TOTAL = 60;            // 전체 카드 수
  strip.innerHTML = "";
  let winEl = null;
  for (let i = 0; i < TOTAL; i++) {
    let el;
    if (i === WIN_AT) { el = makeItem(winName); winEl = el; }
    else { el = makeItem(MENUS[rand(MENUS.length)]); }
    strip.appendChild(el);
  }

  const windowW = strip.parentElement.clientWidth;
  const center = windowW / 2;
  // 당첨 카드 중앙 정렬을 위한 최종 translateX
  const finalX = center - (WIN_AT * ITEM_W + ITEM_W / 2);
  // 시작은 훨씬 왼쪽(더 음수)에서 -> 오른쪽으로 스윕
  const sweep = (TOTAL - WIN_AT - 6) * ITEM_W; // 충분한 스윕 거리
  const startX = finalX - sweep;

  strip.style.transition = "none";
  strip.style.transform = `translateX(${startX}px)`;
  // 강제 리플로우
  void strip.offsetWidth;

  strip.style.transition = "transform 4.2s cubic-bezier(0.12, 0.62, 0.12, 1)";
  strip.style.transform = `translateX(${finalX}px)`;

  const onEnd = () => {
    strip.removeEventListener("transitionend", onEnd);
    if (winEl) winEl.classList.add("win");
    resEmoji.textContent = emojiFor(winName);
    resName.textContent = winName;
    result.classList.add("show");
    spinning = false;
    spinBtn.disabled = false;
    spinBtn.textContent = "🎰 다시!";
    againBtn.style.display = "inline-block";
  };
  strip.addEventListener("transitionend", onEnd);
}

spinBtn.addEventListener("click", spin);
againBtn.addEventListener("click", spin);
